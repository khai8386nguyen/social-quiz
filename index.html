<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whimsy Swirls — What's your froyo flavour?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #e9a43b 0%, #d9873e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .site {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 16px;
      border: 0.5px solid rgba(0,0,0,0.1);
      box-shadow: 0 20px 50px rgba(87, 53, 31, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .screen { display: none; padding: 2.5rem 2rem; animation: fadeIn 0.3s ease; flex: 1; }
    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Home screen */
    .hero-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: #f7e8d6; display: flex; align-items: center;
      justify-content: center; margin-bottom: 1.25rem;
    }
    .hero-icon i { font-size: 28px; color: #d9873e; }
    .hero-title { font-size: 22px; font-weight: 600; color: #57351f; text-align: center; margin-bottom: 0.5rem; }
    .hero-sub { font-size: 14px; color: #57351f; text-align: center; margin-bottom: 1.75rem; line-height: 1.6; max-width: 340px; }
    .start-btn {
      padding: 0.7rem 2.25rem; background: #e9a43b; color: #57351f;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .start-btn:hover { background: #d9873e; }

    /* Quiz screen */
    .quiz-wrap { width: 100%; }

    .dots-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 1.75rem; flex-wrap: wrap; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #e5e5e5;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .dot.done { background: #efc98a; }
    .dot.active { background: #e9a43b; transform: scale(1.3); }

    .q-text { font-size: 17px; font-weight: 600; color: #57351f; margin-bottom: 1.25rem; line-height: 1.5; }

    .q-image {
      width: 100%; height: auto; aspect-ratio: 1447 / 1087;
      object-fit: cover; border-radius: 12px; margin-bottom: 1.25rem;
      background: #f7e8d6;
    }

    .opt {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 0.8rem 2.5rem 0.8rem 1rem; margin-bottom: 0.65rem;
      border-radius: 12px; border: 1px solid #ddd;
      background: #fff; color: #57351f; font-size: 14px;
      cursor: pointer; text-align: left; line-height: 1.4;
      transition: border-color 0.15s, background 0.15s;
      font-family: 'Lexend Deca', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      position: relative;
    }
    .opt:hover { border-color: #e9a43b; background: #f7e8d6; color: #57351f; }
    .opt.selected {
      border: 2px solid #c5651f; background: #fdf1e0; color: #57351f;
      font-weight: 600; padding: calc(0.8rem - 1px) 2.5rem calc(0.8rem - 1px) calc(1rem - 1px);
    }
    .opt.selected::after {
      content: "\2713"; position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%;
      background: #c5651f; color: #fff; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .opt-letter {
      width: 24px; height: 24px; border-radius: 50%; border: 0.5px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500; flex-shrink: 0; margin-top: 1px; opacity: 0.6;
    }
    .back-btn {
      display: none; align-items: center; gap: 6px;
      margin-top: 1rem; padding: 0.5rem 1rem;
      border-radius: 8px; border: 0.5px solid #ddd;
      background: #fff; color: #57351f; font-size: 14px;
      cursor: pointer; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .back-btn:hover { background: #f5f5f5; color: #57351f; }


    .action-row { display: flex; gap: 10px; width: 100%; }
    .retry-btn {
      flex: 1; padding: 0.7rem; border-radius: 8px;
      border: 0.5px solid #ccc; background: #fff; color: #57351f;
      font-size: 14px; cursor: pointer; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .retry-btn:hover { background: #f5f5f5; }
    .share-btn {
      flex: 1; padding: 0.7rem; border-radius: 8px;
      border: none; background: #e9a43b; color: #57351f;
      font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .share-btn:hover { background: #d9873e; }
    .share-toast { font-size: 13px; color: #0F6E56; margin-top: 0.75rem; text-align: center; display: none; }

    footer {
      text-align: center; font-size: 12px; color: #57351f;
      padding: 1rem; border-top: 0.5px solid #eee;
      width: 100%;
    }

    /* Mobile */
    @media (max-width: 480px) {
      body { padding: 1.5rem 1rem; }
      .site { border-radius: 16px; }
      .screen { padding: 1.75rem 1.5rem; }

      .hero-icon { width: 52px; height: 52px; margin-bottom: 1rem; }
      .hero-icon i { font-size: 22px; }
      .hero-title { font-size: 19px; margin-bottom: 0.4rem; }
      .hero-sub { font-size: 13px; margin-bottom: 1.5rem; max-width: 280px; line-height: 1.5; }
      .start-btn { padding: 0.6rem 1.9rem; font-size: 14px; }

      .dots-row { gap: 6px; margin-bottom: 1.25rem; }
      .dot { width: 7px; height: 7px; }

      .q-text { font-size: 16px; margin-bottom: 1rem; line-height: 1.45; }
      .q-image { margin-bottom: 1rem; border-radius: 10px; }
      .opt { font-size: 14px; padding: 0.75rem 2.25rem 0.75rem 0.9rem; margin-bottom: 0.5rem; gap: 8px; }
      .opt.selected { padding: calc(0.75rem - 1px) 2.25rem calc(0.75rem - 1px) calc(0.9rem - 1px); }
      .back-btn { font-size: 13px; padding: 0.45rem 0.9rem; margin-top: 0.75rem; }

      .action-row { flex-direction: column; gap: 8px; }
      .retry-btn, .share-btn { padding: 0.6rem; font-size: 13px; }

      footer { font-size: 11px; padding: 0.75rem; }
    }

</style>
</head>
<body>

<div class="site">
  <!-- Home -->
  <div class="screen active" id="screen-home">
    <img class="q-image" src="page%20images/Intro.png" alt="Welcome to Whimsy Swirls" />
    <div class="hero-sub">Ordering a froyo should be simple, right? Well, not quite! Come along and discover your signature froyo flavour!</div>
    <button class="start-btn" onclick="startQuiz()">Start quiz &rarr;</button>
  </div>

  <!-- Quiz -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-wrap">
      <div class="dots-row" id="q-dots"></div>
      <div class="q-text" id="q-text"></div>
      <img class="q-image" id="q-image" src="" alt="" />
      <div id="q-options"></div>
      <button class="back-btn" id="back-btn" onclick="goBack()"><i class="ti ti-arrow-back-up"></i> Back</button>
    </div>
  </div>

  <!-- Final transition -->
  <div class="screen" id="screen-final">
    <div class="hero-title">Your froyo is ready!</div>
    <div class="hero-sub">A magical spoon glows&hellip; Every froyo tells a story. Let's see what yours says&hellip;</div>
    <button class="start-btn" onclick="showResult()">Next &rarr;</button>
  </div>

  <!-- Result -->
  <div class="screen" id="screen-result">
    <div style="width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;">
      <div id="result-capture" style="width:100%;display:flex;flex-direction:column;align-items:center;background:#fff;">
        <img class="q-image" id="result-image" src="" alt="" />
      </div>
      <div class="action-row">
        <button class="retry-btn" onclick="restart()">&#8635; Retake</button>
        <button class="share-btn" onclick="downloadResult()">&#8681; Download result</button>
      </div>
      <div class="share-toast" id="share-toast">&#10003; Image downloaded!</div>
    </div>
  </div>

  <footer>Telegram @chipthelemon &middot; www.khai8386nguyen.github.io/</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const questions = [
    {
      title: "You enter the shop. The menu board lights up with over 40 different flavours.",
      text: "What's your first instinct?",
      image: "page%20images/01.png",
      options: [
        { text: "\u201cLet's just pick something new!\u201d", scores: { doer: 2 } },
        { text: "I already researched the menu before coming.", scores: { planner: 2 } },
        { text: "Struggling to decide for 15 mins on what to order.", scores: { thinker: 2 } },
        { text: "Immediately go for the same flavour you always order.", scores: { laser: 2 } }
      ]
    },
    {
      title: "Your queue suddenly becomes really long.",
      text: "What do you do?",
      image: "page%20images/02.png",
      options: [
        { text: "Jump into whichever queue looks shortest.", scores: { doer: 2 } },
        { text: "Stay in the same queue no matter what.", scores: { follow: 2 } },
        { text: "Keep switching to the \u201cfaster\u201d queue.", scores: { thinker: 2 } },
        { text: "Notice yourself getting impatient.", scores: { storm: 2 } }
      ]
    },
    {
      title: "",
      text: "While waiting, you notice a magical \u201cCreate Your Own Flavour\u201d machine.",
      image: "page%20images/03.png",
      options: [
        { text: "Think back to all the flavours you've enjoyed before.", scores: { thinker: 2 } },
        { text: "Lose track of time creating the perfect flavour.", scores: { laser: 2 } },
        { text: "Spend ten minutes finding the perfect recipe before starting.", scores: { planner: 2 } }
      ]
    },
    {
      title: "When you turn around, you see a magical red door",
      text: "What do you do?",
      image: "page%20images/04.png",
      options: [
        { text: "Ask around before opening the door.", scores: { thinker: 1, planner: 1 } },
        { text: "Decide to just open the door and see for yourself.", scores: { doer: 2 } },
        { text: "Ignore it and head to the cashier.", scores: { follow: 2 } },
        { text: "Feeling anxious, \u201cI wonder what might be behind it…\u201d", scores: { storm: 2 } }
      ]
    },
    {
      title: "The red door opens to reveal a magical toppings station.",
      text: "You see 2 routes you can take…",
      image: "page%20images/05.png",
      options: [
        { text: "Route A - The Safe Bet, familiar favourites.", scores: { planner: 2 } },
        { text: "Route B - Mystery Toppings, surprise me!", scores: { doer: 2 } },
        { text: "Stuck at the crossroads because you can't decide.", scores: { thinker: 2 } }
      ]
    },
    {
      title: "Oh no!",
      text: "Your favourite topping just ran out! What do you do?",
      image: "page%20images/06.png",
      options: [
        { text: "Pick another topping and keep moving.", scores: { follow: 2 } },
        { text: "Feeling disappointed, as it was your favourite.", scores: { storm: 1, laser: 1 } },
        { text: "\u201cThat wasn't part of the plan…\u201d Finds the closest substitute.", scores: { planner: 2 } },
        { text: "Take so long comparing alternatives that multiple people get their froyo first.", scores: { thinker: 2 } }
      ]
    },
    {
      title: "You accidentally spill some toppings.",
      text: "What happens next?",
      image: "page%20images/07.png",
      options: [
        { text: "Feel really guilty and embarrassed for making a mess.", scores: { storm: 2 } },
        { text: "You don't notice the spill because you're so fixated on reaching the cashier.", scores: { laser: 2 } },
        { text: "Clean it up and keep going.", scores: { follow: 2 } }
      ]
    },
    {
      title: "The cashier asks:",
      text: "\u201cWould you like to try today's mystery topping?\u201d",
      image: "page%20images/08.png",
      options: [
        { text: "Nope, I'm happy with what I have!", scores: { follow: 1, laser: 1 } },
        { text: "Yes! It sounds exciting.", scores: { storm: 1, doer: 1 } },
        { text: "Ask fifteen follow-up questions about the topping before deciding.", scores: { thinker: 2 } },
        { text: "Nope, I don't like being surprised. What if I don't like it?", scores: { planner: 2 } }
      ]
    },
    {
      title: "After paying, you try to find a seat.",
      text: "The whole place is completely packed!",
      image: "page%20images/09.png",
      options: [
        { text: "Feel overwhelmed and frustrated that there are no seats.", scores: { storm: 2 } },
        { text: "Choose one seat closest to the window and wait for it.", scores: { laser: 2 } },
        { text: "Look around before deciding whether to wait or head home.", scores: { planner: 2 } },
        { text: "Leave the store and walk home while eating.", scores: { follow: 1, doer: 1 } }
      ]
    },
    {
      title: "Before you leave, the staff asks you…",
      text: "\u201cWhat's the BEST part of building your froyo?\u201d",
      image: "page%20images/10.png",
      options: [
        { text: "Being spontaneous and trying something new!", scores: { doer: 2 } },
        { text: "Discovering what I like in my froyo!", scores: { thinker: 2 } },
        { text: "Planning and crafting out a perfect combo of yogurt and topping!", scores: { planner: 2 } },
        { text: "Finally seeing it all come together makes it worth it!", scores: { follow: 2 } },
        { text: "How happy it made me feel!", scores: { storm: 2 } },
        { text: "I loved getting completely absorbed in the process!", scores: { laser: 2 } }
      ]
    }
  ];

  const resultData = {
    doer: {
      label: "The Doer",
      flavour: "Rainbow Rush",
      badgeBg: "#FAEEDA", badgeColor: "#633806",
      desc: "You leap before you look, in the best way. Life's too short to overthink the toppings, so you dive in, try new things, and trust your gut. Bold, bright, and full of surprises, just like your flavour."
    },
    planner: {
      label: "The Planner",
      flavour: "Honey Granola Bliss",
      badgeBg: "#F3E5D0", badgeColor: "#6B4423",
      desc: "You like to know what you're getting into, and that's not a bad thing. You do your research, weigh your options, and build something reliably delicious. Wholesome, grounded, and always prepared."
    },
    thinker: {
      label: "The Thinker",
      flavour: "Matcha Bloom",
      badgeBg: "#E1F5EE", badgeColor: "#085041",
      desc: "You take your time because the details matter to you. Every decision gets turned over in your mind before you commit, and that thoughtfulness is your strength. Calm, considered, and quietly deep."
    },
    laser: {
      label: "The Laser",
      flavour: "Triple Chocolate Crunch",
      badgeBg: "#E8DED9", badgeColor: "#4A2E1F",
      desc: "Once you're locked in, nothing else exists. You get so absorbed in what you're doing that the world fades into the background. Rich, intense, and impossible to distract."
    },
    follow: {
      label: "Follow Through",
      flavour: "Salted Caramel Crunch",
      badgeBg: "#EEEDFE", badgeColor: "#3C3489",
      desc: "You don't need everything to go perfectly, you just need to keep moving. When plans change, you adapt, adjust, and get it done. Steady, dependable, with just the right amount of edge."
    },
    storm: {
      label: "The Storm",
      flavour: "Berry Burst",
      badgeBg: "#FCE4EC", badgeColor: "#8E2450",
      desc: "You feel things fully, and you're not afraid to show it. Frustration, excitement, joy, it all comes through in bursts of energy. Vivid, expressive, and impossible to ignore."
    }
  };

  const styleOrder = ["planner", "thinker", "laser", "follow", "storm", "doer"];

  // Maps each result style to its image in the "flavour cards" GitHub folder.
  // Best-guess filenames based on the flavour names above — update these to
  // match your actual uploaded filenames if they differ.
  const flavourImages = {
    doer: "flavour%20cards/rainbow_rush.jpeg",
    planner: "flavour%20cards/honey_bliss.jpeg",
    thinker: "flavour%20cards/matcha_bloom.jpeg",
    laser: "flavour%20cards/chocolate_crunch.jpeg",
    follow: "flavour%20cards/salted_caramel_crunch.jpeg",
    storm: "flavour%20cards/berry_burst.jpeg"
  };

  // The max number of points each category could possibly earn across the
  // whole quiz (i.e. if every question's highest-scoring option for that
  // category had been picked). Used to turn raw points into a percentage
  // of "how much of this style you showed", so categories with fewer
  // scoring opportunities aren't penalised against categories with more.
  function computeMaxScores() {
    const max = {};
    styleOrder.forEach(key => { max[key] = 0; });
    questions.forEach(q => {
      const questionMax = {};
      styleOrder.forEach(key => { questionMax[key] = 0; });
      q.options.forEach(o => {
        for (const key in o.scores) {
          if (o.scores[key] > questionMax[key]) questionMax[key] = o.scores[key];
        }
      });
      styleOrder.forEach(key => { max[key] += questionMax[key]; });
    });
    return max;
  }

  const maxScores = computeMaxScores();

  let current = 0, scores = {}, selected = null, history = [], lastWinner = null;

  function resetScores() {
    scores = { doer: 0, planner: 0, thinker: 0, laser: 0, follow: 0, storm: 0 };
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function startQuiz() { current = 0; resetScores(); history = []; renderQ(); show('screen-quiz'); }

  function renderQ() {
    const q = questions[current];
    const dots = document.getElementById('q-dots');
    dots.innerHTML = '';
    for (let i = 0; i < questions.length; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i < current ? ' done' : i === current ? ' active' : '');
      dots.appendChild(d);
    }
    document.getElementById('q-text').textContent = q.title ? (q.title + ' ' + q.text) : q.text;
    document.getElementById('q-image').src = q.image;
    document.getElementById('q-image').alt = q.text;
    const prevIdx = history[current];
    document.getElementById('q-options').innerHTML = q.options.map((o,i) =>
      `<button class="opt${prevIdx === i ? ' selected' : ''}" onclick="pick(${i})">${o.text}</button>`
    ).join('');
    document.getElementById('back-btn').style.display = current > 0 ? 'flex' : 'none';
    selected = null;
  }

  function pick(idx) {
    selected = idx;
    document.querySelectorAll('.opt').forEach((b,i) => b.classList.toggle('selected', i===idx));
    const o = questions[current].options[idx];
    for (const key in o.scores) { scores[key] += o.scores[key]; }
    history[current] = idx;
    current++;
    setTimeout(() => {
      if (current < questions.length) { renderQ(); }
      else { show('screen-final'); }
    }, 300);
  }

  function goBack() {
    if (current <= 0) return;
    current--;
    const prevIdx = history[current];
    if (prevIdx !== undefined) {
      const o = questions[current].options[prevIdx];
      for (const key in o.scores) { scores[key] -= o.scores[key]; }
    }
    renderQ();
  }

  function categoryPct(key) {
    return maxScores[key] ? (scores[key] / maxScores[key]) : 0;
  }

  function showResult() {
    let winner = styleOrder[0];
    for (const key of styleOrder) {
      if (categoryPct(key) > categoryPct(winner)) winner = key;
    }
    lastWinner = winner;
    const r = resultData[winner];

    const img = document.getElementById('result-image');
    img.src = flavourImages[winner];
    img.alt = r.flavour;
    document.getElementById('share-toast').style.display = 'none';

    show('screen-result');
  }

  function restart() { current = 0; resetScores(); history = []; renderQ(); show('screen-quiz'); }

  function downloadResult() {
    const target = document.getElementById('result-capture');
    const flavour = lastWinner ? resultData[lastWinner].flavour : 'result';
    const filename = 'whimsy-swirls-' + flavour.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png';

    html2canvas(target, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();

      const t = document.getElementById('share-toast');
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2500);
    }).catch(() => {
      const t = document.getElementById('share-toast');
      t.textContent = 'Couldn\u2019t generate image — try a screenshot instead.';
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    });
  }

</script>

</body>
</html>
